<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">RiskFirst</title>
  <desc id="desc">Risk-aware pull request reviews that keep important changes in view.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1423"/>
      <stop offset="1" stop-color="#172a3c"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#6ee7c0"/>
      <stop offset="1" stop-color="#67baff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#background)"/>
  <path d="M0 248H1200" stroke="#315064" stroke-width="1" opacity=".7"/>
  <g transform="translate(70 58)">
    <rect x="0" y="0" width="184" height="184" rx="38" fill="#14283b" stroke="#426078" stroke-width="2"/>
    <path d="M92 29 148 51v44c0 38-23 62-56 80-33-18-56-42-56-80V51l56-22Z" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linejoin="round"/>

  <rect x="303" y="218" width="297" height="3" rx="2" fill="url(#accent)"/>
  <text x="303" y="254" fill="#79e0c2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">RISK-AWARE PR REVIEW</text>
  <g fill="none" stroke="#487083" stroke-width="2" opacity=".55">
    <path d="M998 62h134M974 100h158M1014 138h118M986 176h146M1028 214h104"/>
